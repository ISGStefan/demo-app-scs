name: Build and publish OAuth mock image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: isgstefan/demo-app-scs-oauth-mock

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Playwright browser and system dependencies
        run: npx playwright@1.61.0 install --with-deps chromium

      - name: Build application
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify OAuth mock JAR exists
        run: |
          ls -lah oauth-mock-server/target/
          test -f oauth-mock-server/target/my-app-oauth-mock.jar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OAuth mock image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sgc-test \
            oauth-mock-server

      - name: Push OAuth mock image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sgc-test
